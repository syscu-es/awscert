name: Update knowledge base

# Manual only — never runs automatically. Re-scrapes the AWS exam guides, optionally
# regenerates practice questions (if OPENAI_API_KEY is set as a repo secret), rebuilds
# the static bundle, and commits the result to main — which then triggers the normal
# deploy.yml workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_kb:
    name: Refresh AWS certification KB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape AWS exam guides
        run: npm run kb:scrape

      - name: Regenerate questions (if OPENAI_API_KEY is set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            npm run kb:generate
          else
            echo "OPENAI_API_KEY not set as a repo secret — skipping question regeneration. Domains/task statements are still refreshed."
          fi

      - name: Rebuild static bundle
        run: npm run kb:build

      - name: Commit and push if changed
        run: |
          git config user.name "AWS KB Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/kb-data src/data/certifications.js
          if git diff --cached --quiet; then
            echo "No KB changes since last refresh — nothing to commit."
          else
            git commit -m "chore(kb): refresh AWS certification knowledge base"
            git push
          fi
